<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dans Eden Kaktüs</title>
<meta name="theme-color" content="#0f1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaktüs">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1230'/%3E%3Crect x='27' y='12' width='11' height='33' rx='5.5' fill='%234fd07f'/%3E%3Crect x='15' y='24' width='12' height='9' rx='4.5' fill='%234fd07f'/%3E%3Crect x='38' y='19' width='12' height='9' rx='4.5' fill='%234fd07f'/%3E%3Cpath d='M21 44h22l-3 11H24z' fill='%2340c4dd'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f1230'/%3E%3Crect x='27' y='12' width='11' height='33' rx='5.5' fill='%234fd07f'/%3E%3Crect x='15' y='24' width='12' height='9' rx='4.5' fill='%234fd07f'/%3E%3Crect x='38' y='19' width='12' height='9' rx='4.5' fill='%234fd07f'/%3E%3Cpath d='M21 44h22l-3 11H24z' fill='%2340c4dd'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Dans%20Eden%20Kakt%C3%BCs","short_name":"Kakt%C3%BCs","start_url":".","display":"standalone","background_color":"%230f1230","theme_color":"%230f1230"}'>
<style>
  :root{--night:#0f1230;--panel:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);
    --cream:#f4f6ff;--dim:#98a0d8;--hot:#ff5c8a;--sun:#ffc14d;--aqua:#40c4dd;--leaf:#4fd07f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;padding:0;overscroll-behavior-x:none}
  body{min-height:100dvh;overflow:hidden;background:radial-gradient(120% 65% at 50% 0%,#2a2570 0%,rgba(42,37,112,0) 62%),var(--night);
    color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;padding:0}
  .app{width:100%}
  .top{display:flex;align-items:center;justify-content:center;position:absolute;top:8px;left:10px;right:10px;height:34px}
  .top h1{font-size:16.5px;font-weight:800;margin:0}
  .top h1 span{color:var(--leaf)}
  .langsel{position:absolute;left:0;top:0;height:34px;max-width:92px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:12px;color:var(--dim);font:inherit;font-size:11.5px;font-weight:700;padding:0 5px}
  .gear{position:absolute;right:0;top:0;width:34px;height:34px;border:0;background:transparent;color:rgba(255,255,255,.28);font-size:17px;cursor:pointer}

  .stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:pointer;
    background:radial-gradient(75% 50% at 50% 20%,rgba(64,196,221,.16),rgba(64,196,221,0) 70%),
      linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    display:flex;justify-content:center;align-items:flex-end}
  .stage svg{display:block;height:100%;width:auto;max-width:100%;pointer-events:none;overflow:visible}
  .badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
    color:var(--dim);background:rgba(0,0,0,.32);border:1px solid var(--line);padding:7px 13px;border-radius:999px;pointer-events:none}
  .who{position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;color:var(--dim);
    background:rgba(0,0,0,.32);border:1px solid var(--line);padding:7px 12px;border-radius:999px;pointer-events:none}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  .dot.live{background:var(--hot);animation:pulse 1s infinite}
  .dot.busy{background:var(--sun)}
  @keyframes pulse{50%{opacity:.25}}
  .hint{position:absolute;left:0;right:0;bottom:108px;text-align:center;font-size:12.5px;color:rgba(255,255,255,.5);pointer-events:none}
  .notes{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;overflow:hidden}
  .nf{position:absolute;bottom:24%;font-size:23px;opacity:0;animation:fly 1.7s ease-out forwards;text-shadow:0 2px 7px rgba(0,0,0,.45)}
  @keyframes fly{0%{opacity:0;transform:translateY(0) scale(.5)}18%{opacity:1}100%{opacity:0;transform:translateY(-150px) scale(1.2) rotate(var(--r))}}
  .song{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:var(--sun);
    pointer-events:none;opacity:0;transition:opacity .3s}
  .song.on{opacity:1}
  .meter{position:absolute;left:12px;right:12px;top:48px;height:8px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;display:none;pointer-events:none}
  .meter.on{display:block}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--hot))}

  .navArr{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:54px;border:1px solid var(--line);
    border-radius:14px;background:rgba(0,0,0,.32);color:rgba(255,255,255,.8);font:inherit;font-size:26px;font-weight:800;
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;padding:0 0 3px}
  .navArr:active{background:rgba(255,255,255,.18)}
  #arrL{left:8px;animation:nudgeL 1.6s ease-in-out 3}
  #arrR{right:8px;animation:nudgeR 1.6s ease-in-out 3}
  @keyframes nudgeR{0%,100%{transform:translateY(-50%)}50%{transform:translateY(-50%) translateX(4px)}}
  @keyframes nudgeL{0%,100%{transform:translateY(-50%)}50%{transform:translateY(-50%) translateX(-4px)}}
  .dots{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:4;
    display:flex;justify-content:center;gap:8px;margin:0}
  .cdot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.22);cursor:pointer;
    transition:transform .15s,background .15s}
  .cdot.on{background:var(--leaf);transform:scale(1.4)}

  .fxTitle{margin:11px 2px 5px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .fxTitle span{opacity:.7;font-weight:600;text-transform:none;letter-spacing:0}

  .menu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:11;
    width:64px;height:44px;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.42);
    color:rgba(255,255,255,.85);font-size:20px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .menu:active{background:rgba(255,255,255,.16)}
  .overlay{position:fixed;inset:0;z-index:10;display:none;background:rgba(8,10,30,.2)}
  .overlay.on{display:block}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    gap:9px;padding:0 12px calc(64px + env(safe-area-inset-bottom));pointer-events:none}
  .panel>*{pointer-events:auto}
  .modes{order:1}.fxWrap{order:2}.pair{order:3}.go{order:4}
  .fxWrap{width:min(400px,100%)}
  .fxWrap .fxTitle{margin:0 2px 5px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  body.ovon .badge,body.ovon .who,body.ovon .hint,body.ovon .dots,body.ovon .navArr,body.ovon .diag{opacity:0}


  .modes{display:flex;gap:9px;width:min(340px,100%)}
  .modes button{flex:1;border:2px solid var(--line);background:rgba(10,14,40,.45);color:var(--dim);font:inherit;font-weight:800;
    font-size:15px;padding:8px 4px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .modes button b{font-size:20px;line-height:1}
  .modes button[aria-pressed="true"]{background:var(--cream);color:#1b1a44;border-color:var(--cream)}

  .go{width:min(340px,100%);border:0;cursor:pointer;font:inherit;font-weight:900;font-size:20px;color:#25203f;
    background:linear-gradient(180deg,rgba(127,240,168,.92),rgba(79,208,127,.92));padding:13px 10px;border-radius:22px;box-shadow:0 6px 0 #2b8a52;
    transition:transform .08s,box-shadow .08s}
  .go:active{transform:translateY(4px);box-shadow:0 3px 0 #2b8a52}
  .go.on{background:linear-gradient(180deg,#ff8fb0,var(--hot));box-shadow:0 7px 0 #b23258;color:#fff}

  .grid{display:none;gap:7px;margin-top:0;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .grid.on{display:flex}
  .grid::-webkit-scrollbar{display:none}
  .grid button{flex:0 0 auto;min-width:64px;border:2px solid var(--line);background:rgba(10,14,40,.5);color:var(--cream);font:inherit;
    padding:7px 8px 6px;border-radius:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10.5px;font-weight:700;line-height:1.15}
  .grid button b{font-size:22px;line-height:1}
  .grid button[aria-pressed="true"]{background:var(--aqua);border-color:var(--aqua);color:#062b34}

  .pair{display:flex;gap:9px;width:min(340px,100%)}
  .pair button{flex:1;border:2px solid var(--line);background:rgba(10,14,40,.45);color:var(--cream);font:inherit;font-weight:800;
    font-size:15px;padding:10px 4px;border-radius:18px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .pair button:active{transform:scale(.95)}
  .pair button.on{background:var(--sun);border-color:var(--sun);color:#3a2a05}
  .modes button:active,.go:active{filter:brightness(1.08)}
  .tap{animation:tapPulse .32s ease-out}
  @keyframes tapPulse{0%{transform:scale(1)}35%{transform:scale(.93)}100%{transform:scale(1)}}


  .settings{display:none;flex-direction:column;gap:9px;position:absolute;top:50px;right:10px;
    width:min(340px,calc(100vw - 20px));max-height:calc(100% - 200px);overflow-y:auto;overscroll-behavior:contain;
    padding:13px;border:1px solid var(--line);background:rgba(8,10,30,.72);border-radius:18px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .settings.on{display:flex}
  .settings p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.5}
  .settings select,.settings input{background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--cream);font:inherit;
    font-size:14px;padding:11px;border-radius:12px;-webkit-user-select:text;user-select:text}
  .settings button{border:1px solid var(--line);background:var(--panel);color:var(--cream);font:inherit;font-weight:700;
    font-size:14px;padding:12px;border-radius:12px;cursor:pointer}
  .diag{position:fixed;left:12px;right:12px;bottom:calc(124px + env(safe-area-inset-bottom));z-index:5;
    max-width:436px;margin:0 auto;font-size:12.5px;line-height:1.5;color:var(--sun);background:rgba(35,28,10,.88);
    border:1px solid rgba(255,193,77,.3);padding:10px 12px;border-radius:12px;display:none}
  .diag.on{display:block}
  .ver{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));margin:0;
    font-size:10.5px;letter-spacing:.14em;color:rgba(255,255,255,.22)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
</style>
</head>
<body>
<div class="app">

<div class="stage" id="pad">
  <div class="badge"><i class="dot" id="dot"></i><span id="status">Uyukluyor</span></div>
  <div class="who" id="who">Kaktüs</div>

  <svg id="stage" viewBox="48 0 304 630" role="img" aria-label="Saksıda duran peluş oyuncak">
    <defs>
      <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="0">
        <stop id="bodyA" offset="0" stop-color="#2f9d5c"/><stop id="bodyB" offset=".42" stop-color="#59dc87"/><stop id="bodyC" offset="1" stop-color="#238a4c"/>
      </linearGradient>
      <linearGradient id="gHood" x1="0" y1="0" x2="1" y2="0">
        <stop id="hoodA" offset="0" stop-color="#2ba3bd"/><stop id="hoodB" offset=".45" stop-color="#5fdcee"/><stop id="hoodC" offset="1" stop-color="#1d8ba6"/>
      </linearGradient>
      <linearGradient id="gPot" x1="0" y1="0" x2="1" y2="0">
        <stop id="potA" offset="0" stop-color="#2ea6c2"/><stop id="potB" offset=".4" stop-color="#6fe0f0"/><stop id="potC" offset="1" stop-color="#1c88a4"/>
      </linearGradient>
      <linearGradient id="gLens" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d8e6ef"/></linearGradient>
      <pattern id="pQuilt" patternUnits="userSpaceOnUse" width="36" height="36" patternTransform="rotate(45)">
        <path id="pQuiltL" d="M0,0 H36 M0,18 H36 M0,0 V36 M18,0 V36" stroke="#1a6b3f" stroke-width="2.4" fill="none"/>
      </pattern>
      <pattern id="pDots" patternUnits="userSpaceOnUse" width="44" height="44">
        <circle id="pDotA" cx="11" cy="11" r="5.5" fill="#1a6b3f"/><circle id="pDotB" cx="33" cy="33" r="5.5" fill="#1a6b3f"/>
      </pattern>
      <clipPath id="potClip"><path d="M-96,-170 C-104,-104 -88,-32 -74,-6 C-38,10 38,10 74,-6 C88,-32 104,-104 96,-170 Z"/></clipPath>
    </defs>

    <ellipse cx="200" cy="606" rx="122" ry="15" fill="rgba(0,0,0,.35)"/>

    <!-- ESNEK PELUŞ: eski segmentli form (kafa + 3 gövde + iki parçalı kollar), yumuşak-gövde fiziğiyle.
         Her parça kendi grubunda: desen, diken, çizgi ve cıvatalar parçayla birlikte hareket eder. -->
    <g id="body" transform="translate(200,600)">
      <g id="segNeck"><rect class="limb" x="-15" y="-60" width="30" height="120" rx="15"/></g>
      <g id="seg1" class="segG">
        <rect class="limb sg" x="-25" y="-31" width="50" height="62" rx="24"/>
        <rect class="pat sg" x="-25" y="-31" width="50" height="62" rx="24"/>
        <path class="twist" d="M-19,-23 C4,-15 -4,3 18,11"/>
        <g class="ex-spike"><path class="spL" d="M-25,-14 l-11,-4 l11,-4z"/><path class="spR" d="M25,6 l11,-4 l-11,-4z"/></g>
        <g class="ex-bolt"><circle class="bA" cx="-16" cy="-16" r="4"/><circle class="bB" cx="16" cy="-16" r="4"/><circle class="bC" cx="-16" cy="12" r="4"/><circle class="bD" cx="16" cy="12" r="4"/></g>
        <g class="ex-back"><path class="bkA" d="M25,-20 l16,-8 l-4,16z"/><path class="bkB" d="M25,8 l16,-8 l-4,16z"/></g>
        <g class="ex-fluff"><circle r="7"/><circle r="7"/><circle r="7"/><circle r="7"/><circle r="7"/><circle r="7"/></g>
        <g class="ex-coil"><path d="" fill="none" stroke-width="4" stroke-linecap="round" opacity=".6"/></g>
        <g class="ex-stud"><rect width="12" height="9" rx="2" stroke-width="2"/><rect width="12" height="9" rx="2" stroke-width="2"/></g>
      </g>
      <g id="seg2" class="segG">
        <rect class="limb sg" x="-25" y="-31" width="50" height="62" rx="24"/>
        <rect class="pat sg" x="-25" y="-31" width="50" height="62" rx="24"/>
        <path class="twist" d="M18,-23 C-4,-15 4,3 -18,11"/>
        <g class="ex-spike"><path class="spL" d="M-25,2 l-11,-4 l11,-4z"/><path class="spR" d="M25,-18 l11,-4 l-11,-4z"/></g>
        <g class="ex-bolt"><circle class="bA" cx="-16" cy="-18" r="4"/><circle class="bB" cx="16" cy="-18" r="4"/><circle class="bC" cx="-16" cy="10" r="4"/><circle class="bD" cx="16" cy="10" r="4"/></g>
        <g class="ex-back"><path class="bkA" d="M25,-22 l16,-8 l-4,16z"/><path class="bkB" d="M25,6 l16,-8 l-4,16z"/></g>
        <g class="ex-fluff"><circle r="7"/><circle r="7"/><circle r="7"/><circle r="7"/><circle r="7"/><circle r="7"/></g>
        <g class="ex-coil"><path d="" fill="none" stroke-width="4" stroke-linecap="round" opacity=".6"/></g>
        <g class="ex-stud"><rect width="12" height="9" rx="2" stroke-width="2"/><rect width="12" height="9" rx="2" stroke-width="2"/></g>
      </g>
      <g id="seg3" class="segG">
        <rect class="limb sg" x="-31" y="-35" width="62" height="70" rx="29"/>
        <rect class="pat sg" x="-31" y="-35" width="62" height="70" rx="29"/>
        <path class="twist" d="M-22,-25 C6,-15 -6,3 22,13"/>
        <ellipse class="ex-belly" cx="0" cy="3" rx="22" ry="26"/>
        <g class="ex-spike"><path class="spL" d="M-31,-21 l-11,-4 l11,-4z"/><path class="spR" d="M31,-3 l11,-4 l-11,-4z"/></g>
        <g class="ex-bolt"><circle class="bA" cx="-20" cy="-21" r="4"/><circle class="bB" cx="20" cy="-21" r="4"/><circle class="bC" cx="0" cy="15" r="5"/></g>
        <g class="ex-back"><path class="bkA" d="M31,-25 l17,-9 l-4,17z"/><path class="bkB" d="M31,3 l17,-9 l-4,17z"/></g>
        <g class="ex-fluff"><circle r="7"/><circle r="7"/><circle r="7"/><circle r="7"/><circle r="7"/><circle r="7"/></g>
        <g class="ex-coil"><path d="" fill="none" stroke-width="4" stroke-linecap="round" opacity=".6"/></g>
        <g class="ex-stud"><rect width="12" height="9" rx="2" stroke-width="2"/><rect width="12" height="9" rx="2" stroke-width="2"/></g>
      </g>
      <g id="armLU" class="armG"><rect class="limb arm" x="-20" y="-33" width="40" height="66" rx="20"/><path class="side" d="M-14,-23 C-19,-5 -19,13 -14,27"/></g>
      <g id="armLF" class="armG"><rect class="limb arm" x="-19" y="-32" width="38" height="64" rx="19"/><path class="side" d="M-13,-22 C-18,-4 -18,12 -13,24"/><path class="stitch" d="M-10,-16 L10,-16 M-11,0 L11,0 M-10,16 L10,16"/></g>
      <g id="armRU" class="armG"><rect class="limb arm" x="-20" y="-33" width="40" height="66" rx="20"/><path class="side" d="M14,-23 C19,-5 19,13 14,27"/></g>
      <g id="armRF" class="armG"><rect class="limb arm" x="-19" y="-32" width="38" height="64" rx="19"/><path class="side" d="M13,-22 C18,-4 18,12 13,24"/><path class="stitch" d="M-10,-16 L10,-16 M-11,0 L11,0 M-10,16 L10,16"/></g>
      <g id="head">
        <g id="hEars">
          <circle cx="-62" cy="-176" r="30" fill="url(#gBody)" stroke="#15532f" stroke-width="5"/>
          <circle cx="62" cy="-176" r="30" fill="url(#gBody)" stroke="#15532f" stroke-width="5"/>
          <circle cx="-62" cy="-176" r="15" fill="url(#gHood)"/><circle cx="62" cy="-176" r="15" fill="url(#gHood)"/>
        </g>
        <g id="hHorns">
          <path d="M-46,-176 C-58,-206 -50,-224 -34,-228 C-40,-212 -40,-194 -34,-184 Z" fill="url(#gHood)" stroke="#15532f" stroke-width="5" stroke-linejoin="round"/>
          <path d="M46,-176 C58,-206 50,-224 34,-228 C40,-212 40,-194 34,-184 Z" fill="url(#gHood)" stroke="#15532f" stroke-width="5" stroke-linejoin="round"/>
        </g>
        <g id="hAnt">
          <path d="M0,-196 L0,-238" stroke="#9aa6c8" stroke-width="7" stroke-linecap="round"/>
          <circle cx="0" cy="-246" r="13" fill="#ff5c8a" stroke="#3a4463" stroke-width="4"/>
        </g>
        <g id="hHood">
          <path id="hoodShape" d="M-88,-54 C-98,-164 -52,-214 0,-214 C52,-214 98,-164 88,-54 C58,-14 -58,-14 -88,-54 Z"
                fill="url(#gHood)" stroke="#0e5f72" stroke-width="5" stroke-linejoin="round"/>
          <path id="tipLeaf" d="M-16,-206 C-6,-232 6,-232 16,-206 C8,-214 -8,-214 -16,-206 Z" fill="#5fdcee" stroke="#0e5f72" stroke-width="4"/>
        </g>
        <g id="hTuft"><path d="M0,-190 C-16,-212 -6,-232 8,-222 M0,-190 C6,-216 20,-230 28,-214 M0,-190 C-8,-206 -4,-224 -16,-228" stroke="#ff9f1c" stroke-width="6" fill="none" stroke-linecap="round"/></g>
        <path id="faceRound" d="M-70,-58 C-76,-152 -42,-192 0,-192 C42,-192 76,-152 70,-58 C46,-22 -46,-22 -70,-58 Z"
              fill="url(#gBody)" stroke="#15532f" stroke-width="5" stroke-linejoin="round"/>
        <rect id="faceSquare" x="-72" y="-196" width="144" height="150" rx="18" fill="url(#gBody)" stroke="#15532f" stroke-width="5"/>
        <path id="facePat" d="M-70,-58 C-76,-152 -42,-192 0,-192 C42,-192 76,-152 70,-58 C46,-22 -46,-22 -70,-58 Z" fill="url(#pQuilt)" opacity=".5"/>

<script>
const el = id => document.getElementById(id);

/* ================= RIG ================= */
const segRef = id => { const g = el(id); return { el: g, rects: [...g.querySelectorAll('rect.limb, rect.pat')] }; };

  bobY: ch(0, 200, 16), rootRot: ch(0), sx: ch(1, 160, 15), sy: ch(1, 160, 15),
  potSy: ch(1, 220, 18), mouth: ch(.1, 260, 20), mouthW: ch(1, 260, 20), eye: ch(1, 200, 16),
  pupX: ch(0, 80, 12), pupY: ch(0, 80, 12)

let state = 'idle', level = 0, blinkAt = 2, eyeClose = 0, _t = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function setState(s, label) {
  if (s === 'dance' && state !== 'dance') newDance();
  if (s === 'talking' && state !== 'talking') talkSeed = rnd(0, 9);
  state = s;
  el('dot').className = 'dot' + (s === 'listening' ? ' live' : (s === 'thinking' ? ' busy' : ''));
  const ix = { idle: 0, listening: 1, thinking: 2, talking: 3, dance: 4, song: 5 }[s];
  el('status').textContent = label || (L && L.st[ix]) || '';
}
function restState() {
  if (running && mode === 'elastic') setState('idle', L.elaSt);
  else setState(running ? 'listening' : 'idle');
}
let danceId = 0, danceSpd = 5.2, danceSeed = 0, talkSeed = 0, beat = 0, songBpm = 120;
function newDance() { danceId = Math.floor(Math.random() * 5); danceSpd = rnd(4.2, 6.4); danceSeed = rnd(0, 9); }
let fidget = null, fidgetAt = 8;
function newFidget() { fidget = { k: Math.floor(Math.random() * 4), t: 0, d: rnd(1.4, 2.2) }; }

function danceTargets(T, b) {
  if (danceId === 0) {
    T.s1.t = Math.sin(b) * 7; T.s2.t = Math.sin(b - .7) * 11; T.s3.t = Math.sin(b - 1.4) * 15; T.head.t = Math.sin(b - 2) * 12;
    T.armL.t = -98 + Math.sin(b) * 42; T.armLF.t = -38 + Math.sin(b * 2) * 34;
    T.armR.t = 98 + Math.sin(b + Math.PI) * 42; T.armRF.t = 38 + Math.sin(b * 2 + 1) * 34;
    T.bobY.t = -Math.abs(Math.sin(b)) * 12; T.rootRot.t = Math.sin(b * .5) * 5;
  } else if (danceId === 1) {
    const h = Math.abs(Math.sin(b));
    T.s1.t = Math.sin(b * .5) * 4; T.s2.t = -h * 6; T.s3.t = -h * 9; T.head.t = h * 8;
    T.armL.t = -120 + h * 30; T.armLF.t = -60 + h * 30; T.armR.t = 120 - h * 30; T.armRF.t = 60 - h * 30;
    T.bobY.t = -h * 22; T.rootRot.t = Math.sin(b * .25) * 3; T.sy.t = 1 + h * .08; T.sx.t = 1 - h * .05;
  } else if (danceId === 2) {
    T.s1.t = Math.sin(b) * 12; T.s2.t = Math.sin(b - 1.1) * 14; T.s3.t = Math.sin(b - 2.2) * 16; T.head.t = Math.sin(b - 3.2) * 14;

    T.armR.t = 90 + Math.sin(b - .5) * 55; T.armRF.t = 30 + Math.sin(b - 1.2) * 45;

    T.s1.t = Math.sin(b * .5) * 3; T.s2.t = Math.sin(b) * 6; T.s3.t = Math.sin(b) * 10; T.head.t = Math.sin(b * 2) * 18;

    T.s1.t = st * 6; T.s2.t = -st * 5; T.s3.t = st * 8; T.head.t = -st * 9;
    T.armL.t = -70 - (st > 0 ? 55 : 0); T.armLF.t = st > 0 ? -80 : -10;
    T.armR.t = 70 + (st < 0 ? 55 : 0); T.armRF.t = st < 0 ? 80 : 10;

}
let poke = null;
function pokeTargets(T) {
  if (!poke) return;
  const f = poke.t / poke.d, e = Math.exp(-f * 3.4) * Math.sin(f * 26), m = Math.exp(-f * 3.4);
  const st = poke.style;
  if (poke.part === 'head') { T.head.t += 18 * e; T.s3.t += 11 * e; T.s2.t += 6 * e; T.pupY.t -= 5 * m; }
  else if (poke.part === 'arm') {
    T.armL.t -= (poke.side < 0 ? 55 : 12) * e; T.armLF.t -= (poke.side < 0 ? 45 : 8) * e;
    T.armR.t += (poke.side > 0 ? 55 : 12) * e; T.armRF.t += (poke.side > 0 ? 45 : 8) * e;
    T.s3.t -= 8 * e * poke.side;
  } else { T.s1.t += 7 * e; T.s2.t += 5 * e; T.potSy.t -= .08 * m * Math.abs(Math.sin(f * 26)); }

  if (st === 'bounce') {                       // sevimli: sevinçle zıplar
    T.bobY.t -= 26 * m * Math.abs(Math.sin(f * 13));
    T.armL.t -= 45 * m; T.armR.t += 45 * m;
    T.mouth.t = Math.max(T.mouth.t, .9 * m); T.eye.t = 1 + .4 * m; T.sy.t = 1 + .07 * m;
  } else if (st === 'shrink') {                // uykucu: irkilip büzülür
    T.sy.t = 1 - .12 * m; T.sx.t = 1 + .08 * m; T.bobY.t += 8 * m;
    T.armL.t += 40 * m; T.armR.t -= 40 * m; T.eye.t = 1 - .35 * m; T.mouth.t = Math.max(T.mouth.t, .35 * m);
  } else if (st === 'shake') {                 // komik robot: kademeli, mekanik sarsıntı
    const q = v => Math.round(v * 3) / 3;       // hareketi basamaklara böl: robotik görünsün
    T.rootRot.t += 10 * q(Math.sin(f * 34)) * m;
    T.head.t += 16 * q(Math.sin(f * 26)) * m;
    T.s2.t += 9 * q(Math.sin(f * 20 + 1)) * m;
    T.armL.t -= 45 * q(Math.sin(f * 17)) * m; T.armR.t += 45 * q(Math.sin(f * 17 + 1.6)) * m;
    T.armLF.t -= 30 * q(Math.sin(f * 23)) * m; T.armRF.t += 30 * q(Math.sin(f * 23)) * m;
    T.eye.t = 1 + .55 * Math.round(Math.abs(Math.sin(f * 15))) * m;
    T.bobY.t -= 8 * Math.round(Math.abs(Math.sin(f * 11))) * m;
  } else if (st === 'spin') {                  // huysuz: sinirlenip savurur
    T.rootRot.t += 16 * m * Math.sin(f * 9); T.s2.t += 14 * e; T.head.t -= 16 * m;
    T.armL.t -= 70 * m; T.armR.t += 70 * m; T.mouth.t = Math.max(T.mouth.t, .8 * m); T.eye.t = 1 - .2 * m;
  } else if (st === 'flail') {                 // çılgın: kolları savrulur
    T.armL.t -= 90 * Math.sin(f * 22) * m; T.armR.t += 90 * Math.sin(f * 19 + 1) * m;
    T.armLF.t -= 70 * Math.sin(f * 26) * m; T.armRF.t += 70 * Math.sin(f * 24) * m;
    T.s3.t += 20 * e; T.bobY.t -= 14 * m; T.mouth.t = Math.max(T.mouth.t, m);
  } else {                                     // utangaç: küçülüp gözlerini kapatır
    T.sy.t = 1 - .08 * m; T.head.t += 12 * m * poke.side;
    T.armL.t += 55 * m; T.armR.t -= 55 * m;
    T.eye.t = 1 - .55 * m; T.mouth.t = Math.max(T.mouth.t, .25 * m); T.pupY.t += 4 * m;

}
/* elastik mod: gövde deformasyonu yumuşak-gövde fiziğinde (SB); burada sadece yüz/ifade tepkileri */
const ELA = { on: false, nx: 0, ny: 0, dxv: 0, dyv: 0, max: 0, px: 0, py: 0, spd: 0, zone: 'mid', qstep: 0, lastMag: 0 };
function elasticTargets(T) {
  if (!ELA.on) return;
  const nx = ELA.nx, ny = ELA.ny, up = Math.max(0, -ny), dn = Math.max(0, ny);

  if (ELA.zone === 'low') T.potSy.t -= dn * .16;

  T.mouth.t = Math.max(T.mouth.t, .2 + (up + dn + Math.abs(nx)) * .5);
  T.mouthW.t = 1 + dn * .4 - up * .25;
  T.pupX.t += nx * 6; T.pupY.t += ny * 5;
}
function targets(t) {
  const T = C, a = level;
  T.pupX.t = 0; T.pupY.t = 0; T.eye.t = 1; T.mouthW.t = 1;

  if (state === 'idle') {
    const s = Math.sin(t * 1.1);

    T.armL.t = -76 + Math.sin(t * .9) * 4; T.armLF.t = -20 + Math.sin(t * 1.3) * 5;
    T.armR.t = 76 - Math.sin(t * .9 + .5) * 4; T.armRF.t = 20 - Math.sin(t * 1.3 + .5) * 5;
    T.bobY.t = s * 2; T.rootRot.t = s * .8;
    T.sx.t = 1; T.sy.t = 1; T.potSy.t = 1; T.mouth.t = .1; T.eye.t = 1;
    if (fidget) {
      const f = fidget.t / fidget.d, e = Math.sin(Math.PI * Math.min(1, f));
      if (fidget.k === 0) { T.armL.t -= 60 * e; T.armR.t += 60 * e; T.sy.t = 1 + .07 * e; T.mouth.t = .5 * e; T.head.t -= 8 * e; }
      else if (fidget.k === 1) { T.head.t += 16 * e; T.pupX.t = 6 * e; T.s3.t += 8 * e; }
      else if (fidget.k === 2) { T.bobY.t -= 16 * e; T.potSy.t = 1 - .05 * e; T.armL.t -= 30 * e; T.armR.t += 30 * e; }

    }
  } else if (state === 'listening') {
    const w = Math.sin(t * 9) * a;
    T.s1.t = w * 2; T.s2.t = w * 3; T.s3.t = w * 4 + 2; T.head.t = -w * 4;
    T.armL.t = -104 - a * 24; T.armLF.t = -46 - a * 20; T.armR.t = 104 + a * 24; T.armRF.t = 46 + a * 20;
    T.bobY.t = -a * 5; T.rootRot.t = w * 1.4;
    T.sx.t = 1 - a * .03; T.sy.t = 1 + a * .07; T.potSy.t = 1;
    T.mouth.t = .08 + a * .2; T.eye.t = 1.12 + a * .16; T.pupY.t = -3;
  } else if (state === 'thinking') {
    T.s1.t = -2; T.s2.t = -4; T.s3.t = -7 + Math.sin(t * 1.6) * 2; T.head.t = 13 + Math.sin(t * 1.6) * 2;
    T.armL.t = -68; T.armLF.t = -14; T.armR.t = 44 + Math.sin(t * 3.4) * 5; T.armRF.t = 94;
    T.bobY.t = 0; T.rootRot.t = -2; T.sx.t = 1; T.sy.t = 1; T.potSy.t = 1;
    T.mouth.t = .05; T.eye.t = .85; T.pupX.t = -5; T.pupY.t = -6;
  } else if (state === 'talking') {
    const aa = ELA.on ? a * .25 : a;      // çekiştirilirken konuşma jesti bastırılır
    const g = .35 + aa, q = talkSeed;

      try { pad.setPointerCapture(e.pointerId); } catch (err) { }   // menü/nokta/ekran dışında bırakınca takılmasın
      down(e.clientX, e.clientY);
    });
    pad.addEventListener('pointermove', e => move(e.clientX, e.clientY));
    pad.addEventListener('pointerup', e => { if (onArr(e)) return; up(e.clientX, e.clientY); });
    pad.addEventListener('pointercancel', () => { active = false; if (ELA.on) { ELA.on = false; ELA.nx = 0; ELA.ny = 0; ELA.dxv = 0; ELA.dyv = 0; SB.grab = null; elasticEnd(0); } });
  } else {
    pad.addEventListener('touchstart', e => { if (onArr(e)) return; const t = e.changedTouches[0]; down(t.clientX, t.clientY); }, { passive: true });
    pad.addEventListener('touchmove', e => { const t = e.changedTouches[0]; move(t.clientX, t.clientY); }, { passive: true });
    pad.addEventListener('touchend', e => { if (onArr(e)) return; const t = e.changedTouches[0]; up(t.clientX, t.clientY); });
    pad.addEventListener('mousedown', e => { if (onArr(e)) return; down(e.clientX, e.clientY); });
    pad.addEventListener('mouseup', e => { if (onArr(e)) return; up(e.clientX, e.clientY); });
  }
})();

/* ================= TANIMA ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false, speaking = false, wantRec = false;
if (SR) {
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
  rec.onstart = () => recOn = true;
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const txt = e.results[i][0].transcript.trim();
      if (!txt) continue;
      heardPulse = .6;
      if (e.results[i].isFinal) respond(txt);
    }
  };
  rec.onerror = () => recOn = false;
  rec.onend = () => { recOn = false; if (wantRec && !speaking) setTimeout(startRec, 350); };
}
function startRec() { if (!rec || recOn || speaking || !wantRec) return; try { rec.start(); } catch (e) { } }
function stopRec() { wantRec = false; if (rec && recOn) { try { rec.stop(); } catch (e) { } } }

/* ================= BEYİN + KONUŞMA ================= */
const sysPrompt = () => 'You are a dancing plush toy talking to small children. Reply in ' +
  LANGNAME[langCode] + ' only. At most 2 short simple sentences. Be cheerful, sweet and kind. No emoji, no bullet points.';
let history = [];
let cfgValue = ''; try { cfgValue = localStorage.getItem('kaktus-cfg') || ''; } catch (e) { }
const cfg = () => (el('brainCfg').value || cfgValue).trim();
async function askClaude(msgs) {
  const key = cfg(), h = { 'Content-Type': 'application/json' };
  if (key.startsWith('sk-')) { h['x-api-key'] = key; h['anthropic-version'] = '2023-06-01'; h['anthropic-dangerous-direct-browser-access'] = 'true'; }
  const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: h, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system: sysPrompt(), messages: msgs }) });
  if (!r.ok) throw new Error('claude ' + r.status);
  const d = await r.json();
  return (d.content || []).filter(b => b.type === 'text').map(b => b.text).join(' ').trim();
}
async function askOllama(msgs) {
  const host = cfg().startsWith('http') ? cfg() : 'http://localhost:11434';
  const r = await fetch(host + '/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'llama3.2', stream: false, options: { temperature: .8, num_predict: 120 }, messages: [{ role: 'system', content: sysPrompt() }, ...msgs] }) });
  if (!r.ok) throw new Error('ollama ' + r.status);
  const d = await r.json();
  return ((d.message && d.message.content) || '').trim();
}
const charName = () => (L && L.names[charIx % CHARS.length]) || CHARS[charIx % CHARS.length].name;
function offlineBrain(x) {
  const t = x.toLowerCase(), o = L.off;
  if (!t) return one(o.hi);
  if (/(selam|merhaba|günaydın|naber|hey|hello|hi\b|hallo|salut|bonjour|hola|ciao|olá|привет|мерхаба|مرحبا|नमस्ते)/.test(t)) return one(o.hi);
  if (/(nasılsın|napıyorsun|how are you|wie geht|ça va|cómo estás|come stai|como vai|как дела|كيف حالك|कैसे हो)/.test(t)) return one(o.how);
  if (/(adın ne|ismin ne|kimsin|what is your name|your name|wie heißt|tu t'appelles|cómo te llamas|come ti chiami|seu nome|как тебя зовут|ما اسمك|तुम्हारा नाम)/.test(t)) return one(o.name).replace('{n}', charName());
  if (/(şarkı|türkü|sing|lied|sing a song|chanson|canción|canzone|música|песня|أغنية|गाना)/.test(t)) { setTimeout(sing, 1200); return one(o.sing); }
  if (/[?؟]|neden|niye|nasıl|kim|ne zaman|why|how|who|when|warum|wie|pourquoi|por qué|perché|porque|почему|لماذا|क्यों/.test(t)) return one(o.q);
  if (/(dans et|zıpla|dance|jump|tanz|danse|baila|balla|dança|танцуй|ارقص|नाचो)/.test(t)) { setTimeout(() => { newDance(); setState('dance'); }, 900); return one(o.cmd); }
  const w = x.split(/\s+/).filter(s => s.length > 3).pop() || x;
  return one(o.gen).replace('{w}', w);
}
async function ask(text) {
  const msgs = [...history, { role: 'user', content: text }], m = el('brain').value;
  let out = '';
  if (m === 'offline') out = offlineBrain(text);
  else if (m === 'ollama') out = await askOllama(msgs);
  else if (m === 'claude') out = await askClaude(msgs);
  else { try { out = await askClaude(msgs); } catch (a) { try { out = await askOllama(msgs); } catch (b) { out = offlineBrain(text); } } }
  history = [...msgs, { role: 'assistant', content: out }].slice(-10);
  return out || 'Anlamadım ama seni seviyorum.';
}
let voices = [], chosenVoice = null, savedVoice = '';
try { savedVoice = localStorage.getItem('kaktus-voice') || ''; } catch (e) { }
function fillVoices() {
  const sy = window.speechSynthesis; if (!sy) return;
  voices = sy.getVoices() || []; if (!voices.length) return;
  const pre = new RegExp('^' + langCode, 'i');
  const tr = voices.filter(v => pre.test(v.lang));
  // kaliteli sesler öne: Natural/Neural > Online/Google > yerel varsayılanlar
  const score = v => (/natural|neural/i.test(v.name) ? 4 : 0) + (/online|cloud|google/i.test(v.name) ? 2 : 0) + (v.localService === false ? 1 : 0);
  const list = (tr.length ? tr : voices).slice().sort((a, b) => score(b) - score(a));
  el('voice').innerHTML = '';
  list.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = (tr.length ? '' : '⚠ ') + v.name; el('voice').appendChild(o); });
  chosenVoice = list.find(v => v.name === savedVoice) || list[0] || null;
  if (chosenVoice) el('voice').value = chosenVoice.name;
  if (!tr.length) diag('No ' + LANGNAME[langCode] + ' text-to-speech voice installed on this phone.');
}
if (window.speechSynthesis) { speechSynthesis.onvoiceschanged = fillVoices; fillVoices(); setTimeout(fillVoices, 700); }
const TTSFX = { dry: [1, 1], sincap: [1.9, 1.12], dev: [.35, .85], robot: [.5, 1.3], yanki: [1.05, .95],
  uzayli: [1.75, 1.2], telefon: [1.15, 1.08], koro: [.85, .95], suyalti: [.45, .88] };
function speak(text) {
  const sy = window.speechSynthesis;
  if (!sy) { speaking = false; restState(); return; }
  sy.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (!chosenVoice) fillVoices();
  if (chosenVoice) u.voice = chosenVoice;
  u.lang = (chosenVoice && chosenVoice.lang) || L.locale;
  const tv = parseFloat(el('tone').value), sv = parseFloat(el('speed').value);
  let fk = fxNow();
  // güvenlik ağı: işlenmemiş/yavan ses hiçbir koşulda çıkmasın
  if (fk === 'dry' || !TTSFX[fk]) fk = curChar().voiceFx || 'sincap';
  const m = TTSFX[fk] || [1.6, 1.1];
  const bp = isFinite(tv) ? tv : (curChar().tone || 1.2);
  const br = isFinite(sv) ? sv : (curChar().rate || 1);
  u.pitch = Math.min(2, Math.max(0, bp * m[0]));
  u.rate = Math.min(3, Math.max(.5, br * m[1]));
  fakeSeed = rnd(0, 9);
  speaking = true; if (rec && recOn) { try { rec.stop(); } catch (e) { } }
  u.onstart = () => { fakeTalk = true; setState('talking'); };
  u.onend = () => {
    fakeTalk = false; level = 0; speaking = false; restState();
    if (wantRec) startRec();
  };
  u.onerror = () => { fakeTalk = false; speaking = false; restState(); if (wantRec) startRec(); };
  sy.speak(u);
  setTimeout(() => { if (!fakeTalk && sy.speaking) { fakeTalk = true; setState('talking'); } }, 400);
}
async function respond(text) {
  setState('thinking');
  try { const a = await ask(text); await voiceOut(a); }
  catch (e) { restState(); diag('Cevap alınamadı (' + e.message + ').'); }
}

async function voiceOut(text) {
  speaking = true;
  if (rec && recOn) { try { rec.stop(); } catch (e) { } }
  const wantSynth = el('voiceMode').value === 'karakter' || !window.speechSynthesis;
  if (wantSynth) { try { if (await speakSynth(text)) return; } catch (e) { } }
  speak(text);
}

/* ================= ARAYÜZ ================= */
FX.forEach(k => {
  const b = document.createElement('button');
  b.innerHTML = '<b>' + FXUI[k][0] + '</b>' + FXUI[k][1];
  b.setAttribute('aria-pressed', k === fx);
  b.onclick = () => {
    fx = k; fxByMode[mode] = k;
    [...el('fxGrid').children].forEach(c => c.setAttribute('aria-pressed', c === b));
    // sesli önizleme: efektin ses olduğu kulakla anlaşılsın
    if (!busy && !speaking) {
      if (lastRec) playFx(lastRec, k);
      else speakSynth(one(L.off.hi)).catch(() => { });
    }
  };
  el('fxGrid').appendChild(b);
});
CHARS.forEach((c, i) => {
  const d = document.createElement('button');
  d.className = 'cdot'; d.setAttribute('aria-label', c.name);
  d.onclick = () => switchTo(i, i > charIx % CHARS.length ? 1 : -1);
  el('charDots').appendChild(d);
});
el('arrL').onclick = () => switchChar(-1);
el('arrR').onclick = () => switchChar(1);
function setMode(m) {
  if (m === mode && running) return;
  const wasRunning = running;
  if (running) stopAll();
  mode = m;
  el('mParrot').setAttribute('aria-pressed', m === 'parrot');
  el('mElastic').setAttribute('aria-pressed', m === 'elastic');
  el('go').textContent = running ? L.stop : L.start;
  el('fxGrid').classList.add('on');
  fx = fxByMode[m] || 'sincap';
  [...el('fxGrid').children].forEach((c, i) => c.setAttribute('aria-pressed', FX[i] === fx));
  // elastik modda çekiştirme hemen çalışır, ipucunu göster
  el('hint').textContent = m === 'elastic' ? L.elaSt : L.hint;
  if (m === 'elastic') el('hint').style.display = '';
  if (wasRunning) startAll();   // çalışırken mod değişti: yeni modda kaldığı yerden devam
}
el('mParrot').onclick = () => setMode('parrot');
el('mElastic').onclick = () => setMode('elastic');
el('gear').onclick = () => el('settings').classList.toggle('on');
el('voice').onchange = () => {
  chosenVoice = voices.find(v => v.name === el('voice').value) || chosenVoice;
  savedVoice = el('voice').value;
  try { localStorage.setItem('kaktus-voice', savedVoice); } catch (e) { }
};
el('testVoice').onclick = () => { audio(); voiceOut(one(L.off.hi)); };
el('brainCfg').value = cfgValue;
el('brainCfg').onchange = () => { cfgValue = el('brainCfg').value.trim(); try { localStorage.setItem('kaktus-cfg', cfgValue); } catch (e) { } };
el('brain').onchange = () => {
  const m = el('brain').value;
  el('brainCfg').type = m === 'ollama' ? 'text' : 'password';
  el('brainCfg').placeholder = m === 'ollama' ? 'http://192.168.x.x:11434' : 'sk-ant-…';
};
async function startAll() {
  audio();
  if (mode === 'parrot') { if (!(await ensureMic())) return; }
  else releaseMic();                          // elastik: mikrofon gerekmez
  running = true; busy = false; floorLvl = .01; startedOnce = true;
  el('go').classList.add('on'); el('go').textContent = L.stop;
  el('meter').classList.toggle('on', mode === 'parrot');
  if (mode === 'elastic') setState('idle', L.elaSt);
  else setState('listening');
}
function stopAll() {
  running = false; busy = false; VAD.on = false; VAD.cool = 0; CAP.recording = false;
  CAP.chunks.length = 0; CAP.pre.length = 0; CAP.preLen = 0;
  stopPlayback();
  stopRec(); clearTimeout(songTimer); clearNotes(); SONGVOX.on = false;
  el('songBtn').classList.remove('on'); el('danceBtn').classList.remove('on');
  try { speechSynthesis.cancel(); } catch (e) { }
  fakeTalk = false; speaking = false;
  ELA.on = false; ELA.nx = 0; ELA.ny = 0; ELA.dxv = 0; ELA.dyv = 0; SB.grab = null;
  el('go').classList.remove('on'); el('go').textContent = L.start;
  el('meter').classList.remove('on');
  setState('idle');
}
/* ============ OVERLAY: butonlar istenince görünür ============ */
let ovTimer = null, startedOnce = false;
const OV_WAIT = 3000;
function armOvTimer(ms) {
  clearTimeout(ovTimer);
  if (!startedOnce) return;      // ilk BAŞLA'ya kadar overlay kendiliğinden kaybolmasın
  ovTimer = setTimeout(() => {
    const a = document.activeElement;
    // yazı yazılırken (örn. API anahtarı) paneli kapatma
    if (a && a.tagName === 'INPUT' && el('panel').contains(a)) { armOvTimer(OV_WAIT); return; }
    showOverlay(false);
  }, ms);
}
function showOverlay(on) {
  el('overlay').classList.toggle('on', !!on);
  document.body.classList.toggle('ovon', !!on);
  el('menuBtn').textContent = on ? '✕' : '☰';
  clearTimeout(ovTimer);
  if (on) armOvTimer(OV_WAIT);
}
el('menuBtn').onclick = () => showOverlay(!el('overlay').classList.contains('on'));
el('overlay').addEventListener('pointerdown', e => {
  if (e.target === el('overlay')) showOverlay(false);
  else armOvTimer(OV_WAIT);
});
el('panel').addEventListener('input', () => armOvTimer(OV_WAIT));
el('panel').addEventListener('change', () => armOvTimer(OV_WAIT));
// başlat / dans / şarkı: panel çekilsin, karakter tam ekran izlensin
['danceBtn', 'songBtn'].forEach(id =>
  el(id).addEventListener('click', () => setTimeout(() => showOverlay(false), 350)));
el('go').onclick = async () => {
  if (running) { stopAll(); return; }
  await startAll();
  if (running) showOverlay(false);   // BAŞLA başarılıysa overlay hemen çekilsin
};
let focusTimer = null;
function focusStage() {
  clearTimeout(focusTimer);
  focusTimer = setTimeout(() => {
    const y = Math.max(0, el('pad').getBoundingClientRect().top + window.scrollY - 8);
    try { window.scrollTo({ top: y, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, y); }
  }, 1000);
}
function tap(b) { b.classList.remove('tap'); void b.offsetWidth; b.classList.add('tap'); focusStage(); }
document.addEventListener('click', e => { if (e.target.closest('button,select')) focusStage(); }, true);
el('danceBtn').onclick = () => {
  const b = el('danceBtn'); tap(b); b.classList.add('on');
  audio(); newDance(); setState('dance');
  clearTimeout(window.__d);
  window.__d = setTimeout(() => {
    b.classList.remove('on');
    if (state === 'dance') restState();
  }, 7000);
};
el('songBtn').onclick = () => { const b = el('songBtn'); tap(b); b.classList.add('on'); sing(); };
el('go').addEventListener('click', () => tap(el('go')));
el('mParrot').addEventListener('click', () => tap(el('mParrot')));
el('mElastic').addEventListener('click', () => tap(el('mElastic')));

let savedLang = 'auto'; try { savedLang = localStorage.getItem('kaktus-lang') || 'auto'; } catch (e) { }
applyLang(savedLang === 'auto' ? detectLang() : savedLang, savedLang === 'auto');
buildLangSelect();
applyChar(charIx);
setMode('parrot');
(function boot() {
  showOverlay(true);
  const e0 = checkEnv(); if (e0) diag(e0);
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (iOS && !e0) diag('iPhone: yan taraftaki sessiz anahtarı kapalıysa oyun sesi duyulmaz.');
  if (!window.speechSynthesis) { el('voiceMode').value = 'karakter'; }
})();
</script>
