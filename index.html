<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dans Eden Kaktüs</title>
<meta name="theme-color" content="#0f1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaktüs">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1230'/%3E%3Crect x='27' y='12' width='11' height='33' rx='5.5' fill='%234fd07f'/%3E%3Crect x='15' y='24' width='12' height='9' rx='4.5' fill='%234fd07f'/%3E%3Crect x='38' y='19' width='12' height='9' rx='4.5' fill='%234fd07f'/%3E%3Cpath d='M21 44h22l-3 11H24z' fill='%2340c4dd'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f1230'/%3E%3Crect x='27' y='12' width='11' height='33' rx='5.5' fill='%234fd07f'/%3E%3Crect x='15' y='24' width='12' height='9' rx='4.5' fill='%234fd07f'/%3E%3Crect x='38' y='19' width='12' height='9' rx='4.5' fill='%234fd07f'/%3E%3Cpath d='M21 44h22l-3 11H24z' fill='%2340c4dd'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Dans%20Eden%20Kakt%C3%BCs","short_name":"Kakt%C3%BCs","start_url":".","display":"standalone","background_color":"%230f1230","theme_color":"%230f1230"}'>
<style>
  :root{
    --night:#0f1230; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
    --cream:#f4f6ff; --dim:#98a0d8; --hot:#ff5c8a; --sun:#ffc14d; --aqua:#40c4dd; --leaf:#4fd07f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    background:radial-gradient(120% 65% at 50% 0%, #2a2570 0%, rgba(42,37,112,0) 62%), var(--night);
    color:var(--cream);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;padding:14px 12px 30px;
  }
  .app{width:100%;max-width:480px}
  header{text-align:center}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 3px}
  h1{font-size:clamp(24px,7vw,32px);font-weight:800;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--leaf)}

  .stage{position:relative;margin:8px 0 10px;border-radius:24px;overflow:hidden;
    background:radial-gradient(75% 50% at 50% 20%, rgba(64,196,221,.16), rgba(64,196,221,0) 70%),
      linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border:1px solid var(--line)}
  .stage svg{display:block;width:100%;height:auto}
  .badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    color:var(--dim);background:rgba(0,0,0,.3);border:1px solid var(--line);padding:6px 11px;border-radius:999px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.live{background:var(--hot);animation:pulse 1s infinite}
  .dot.busy{background:var(--sun)}
  @keyframes pulse{50%{opacity:.25}}

  .meter{position:absolute;left:10px;right:10px;bottom:10px;height:6px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;display:none}
  .meter.on{display:block}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--aqua),var(--hot));transition:width .06s linear}
  .meter u{position:absolute;top:-3px;width:2px;height:12px;background:var(--sun);border-radius:2px}

  .modes{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:999px}
  .modes button{flex:1;border:0;background:transparent;color:var(--dim);font:inherit;font-weight:700;font-size:14px;
    padding:10px 6px;border-radius:999px;cursor:pointer}
  .modes button[aria-pressed="true"]{background:var(--cream);color:#1b1a44}

  .fx{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
  .fx::-webkit-scrollbar{display:none}
  .fx button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--cream);
    font:inherit;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer}
  .fx button[aria-pressed="true"]{background:var(--aqua);border-color:var(--aqua);color:#062b34}

  .talk{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .bubble{padding:10px 13px;border-radius:15px;font-size:15px;line-height:1.45;max-width:88%}
  .me{align-self:flex-end;background:rgba(255,255,255,.1);border:1px solid var(--line);border-bottom-right-radius:5px}
  .cactus{align-self:flex-start;background:linear-gradient(135deg,#2f9d5c,#1d7c46);border-bottom-left-radius:5px;font-weight:600}
  .bubble.ghost{opacity:.5;font-style:italic}

  .row{display:flex;gap:9px;margin-top:10px}
  .mic{flex:1;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:17px;color:#25203f;
    background:linear-gradient(180deg,#ffd889,var(--sun));padding:16px 10px;border-radius:18px;
    box-shadow:0 5px 0 #c08a1c;transition:transform .08s,box-shadow .08s}
  .mic:active{transform:translateY(3px);box-shadow:0 2px 0 #c08a1c}
  .mic.on{background:linear-gradient(180deg,#ff8fb0,var(--hot));box-shadow:0 5px 0 #b23258;color:#fff}
  .ghost-btn{border:1px solid var(--line);background:var(--panel);color:var(--cream);font-size:17px;
    padding:16px 17px;border-radius:18px;cursor:pointer}

  .field{display:flex;gap:8px;margin-top:9px}
  .field input{flex:1;min-width:0;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--cream);
    font:inherit;font-size:15px;padding:13px;border-radius:13px}
  .field button{border:1px solid var(--line);background:var(--panel);color:var(--cream);padding:0 15px;border-radius:13px;font:inherit;font-weight:700;cursor:pointer}

  .tune{margin-top:12px;display:none}
  .tune.on{display:block}
  .tune label{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  input[type=range]{width:100%;accent-color:var(--hot)}

  .settings{display:none;flex-direction:column;gap:8px;margin-top:10px}
  .settings.on{display:flex}
  .settings select,.settings input{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--cream);
    font:inherit;font-size:14px;padding:11px;border-radius:12px}
  .diag{margin-top:11px;font-size:12.5px;line-height:1.5;color:var(--sun);background:rgba(255,193,77,.1);
    border:1px solid rgba(255,193,77,.3);padding:10px 12px;border-radius:12px;display:none}
  .diag.on{display:block}
  .note{margin-top:12px;font-size:12px;line-height:1.5;color:var(--dim);text-align:center}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
</style>
</head>
<body>
<div class="app">

<header>
  <p class="eyebrow">Blobidea oyuncak tezgâhı</p>
  <h1>Dans Eden <span>Kaktüs</span></h1>
</header>

<div class="stage">
  <div class="badge"><i class="dot" id="dot"></i><span id="status">Uyukluyor</span></div>

  <svg id="stage" viewBox="0 0 400 640" role="img" aria-label="Saksıda duran kapüşonlu peluş kaktüs">
    <defs>
      <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2f9d5c"/><stop offset=".42" stop-color="#59dc87"/><stop offset="1" stop-color="#238a4c"/>
      </linearGradient>
      <linearGradient id="gHood" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2ba3bd"/><stop offset=".45" stop-color="#5fdcee"/><stop offset="1" stop-color="#1d8ba6"/>
      </linearGradient>
      <linearGradient id="gPot" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2ea6c2"/><stop offset=".4" stop-color="#6fe0f0"/><stop offset="1" stop-color="#1c88a4"/>
      </linearGradient>
      <linearGradient id="gLens" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8e6ef"/>
      </linearGradient>
      <clipPath id="faceClip">
        <path d="M-70,-58 C-76,-152 -42,-192 0,-192 C42,-192 76,-152 70,-58 C46,-22 -46,-22 -70,-58 Z"/>
      </clipPath>
      <clipPath id="potClip">
        <path d="M-96,-170 C-104,-104 -88,-32 -74,-6 C-38,10 38,10 74,-6 C88,-32 104,-104 96,-170 Z"/>
      </clipPath>
    </defs>

    <ellipse cx="200" cy="606" rx="122" ry="15" fill="rgba(0,0,0,.35)"/>

    <g transform="translate(200,440)">
      <g id="rootBob">

        <g id="s1">
          <rect class="limb" x="-25" y="-56" width="50" height="62" rx="24"/>
          <path class="twist" d="M-19,-48 C4,-40 -4,-22 18,-14"/>
          <g transform="translate(0,-52)">
            <g id="s2">
              <rect class="limb" x="-25" y="-56" width="50" height="62" rx="24"/>
              <path class="twist" d="M18,-48 C-4,-40 4,-22 -18,-14"/>
              <g transform="translate(0,-52)">
                <g id="s3">
                  <rect class="limb" x="-31" y="-62" width="62" height="70" rx="29"/>
                  <path class="twist" d="M-22,-52 C6,-42 -6,-24 22,-14"/>

                  <g transform="translate(-27,-30)">
                    <g id="armL">
                      <rect class="limb" x="-20" y="-58" width="40" height="66" rx="20"/>
                      <path class="side" d="M-14,-48 C-19,-30 -19,-12 -14,2"/>
                      <g transform="translate(0,-54)">
                        <g id="armLF">
                          <rect class="limb" x="-19" y="-56" width="38" height="64" rx="19"/>
                          <path class="side" d="M-13,-46 C-18,-28 -18,-12 -13,0"/>
                          <path class="stitch" d="M-10,-40 L10,-40 M-11,-24 L11,-24 M-10,-8 L10,-8"/>
                        </g>
                      </g>
                    </g>
                  </g>

                  <g transform="translate(27,-30)">
                    <g id="armR">
                      <rect class="limb" x="-20" y="-58" width="40" height="66" rx="20"/>
                      <path class="side" d="M14,-48 C19,-30 19,-12 14,2"/>
                      <g transform="translate(0,-54)">
                        <g id="armRF">
                          <rect class="limb" x="-19" y="-56" width="38" height="64" rx="19"/>
                          <path class="side" d="M13,-46 C18,-28 18,-12 13,0"/>
                          <path class="stitch" d="M-10,-40 L10,-40 M-11,-24 L11,-24 M-10,-8 L10,-8"/>
                        </g>
                      </g>
                    </g>
                  </g>

                  <g transform="translate(0,-50)">
                    <g id="head">
                      <!-- kapüşon -->
                      <path d="M-88,-54 C-98,-164 -52,-214 0,-214 C52,-214 98,-164 88,-54 C58,-14 -58,-14 -88,-54 Z"
                            fill="url(#gHood)" stroke="#0e5f72" stroke-width="5" stroke-linejoin="round"/>
                      <path id="hoodTip" d="M-16,-206 C-6,-232 6,-232 16,-206 C8,-214 -8,-214 -16,-206 Z" fill="#5fdcee" stroke="#0e5f72" stroke-width="4"/>
                      <!-- yüz -->
                      <path d="M-70,-58 C-76,-152 -42,-192 0,-192 C42,-192 76,-152 70,-58 C46,-22 -46,-22 -70,-58 Z"
                            fill="url(#gBody)" stroke="#15532f" stroke-width="5" stroke-linejoin="round"/>
                      <!-- kapitone doku -->
                      <g clip-path="url(#faceClip)" stroke="#1a6b3f" stroke-width="2.4" fill="none" opacity=".5">
                        <path d="M-120,-40 L40,-220 M-120,10 L90,-220 M-70,40 L140,-190 M-20,40 L160,-150 M30,40 L170,-100"/>
                        <path d="M120,-40 L-40,-220 M120,10 L-90,-220 M70,40 L-140,-190 M20,40 L-160,-150 M-30,40 L-170,-100"/>
                      </g>
                      <!-- lens gözler -->
                      <g transform="translate(0,-124)">
                        <g id="eyeScale">
                          <ellipse cx="-34" cy="0" rx="28" ry="20" transform="rotate(-15,-34,0)" fill="url(#gLens)" stroke="#14322a" stroke-width="6"/>
                          <ellipse cx="34" cy="0" rx="28" ry="20" transform="rotate(15,34,0)" fill="url(#gLens)" stroke="#14322a" stroke-width="6"/>
                          <g id="pupils" opacity=".85">
                            <circle cx="-32" cy="1" r="6" fill="#14322a"/>
                            <circle cx="32" cy="1" r="6" fill="#14322a"/>
                          </g>
                        </g>
                      </g>
                      <ellipse id="mouth" cx="0" cy="-58" rx="15" ry="4" fill="#2c0f22" stroke="#15532f" stroke-width="3"/>
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>

      </g>
    </g>

    <!-- kumaş saksı -->
    <g id="pot" transform="translate(200,600)">
      <path d="M-96,-170 C-104,-104 -88,-32 -74,-6 C-38,10 38,10 74,-6 C88,-32 104,-104 96,-170 Z"
            fill="url(#gPot)" stroke="#0e5f72" stroke-width="5" stroke-linejoin="round"/>
      <g clip-path="url(#potClip)" stroke="rgba(8,60,74,.35)" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M-52,-160 C-58,-100 -54,-46 -46,-10"/>
        <path d="M-8,-166 C-14,-100 -12,-44 -6,-4"/>
        <path d="M40,-162 C34,-104 38,-48 44,-10"/>
      </g>
      <path d="M-100,-186 C-58,-206 58,-206 100,-186 C104,-168 96,-154 90,-150 C56,-166 -56,-166 -90,-150 C-96,-156 -104,-170 -100,-186 Z"
            fill="#7fe6f4" stroke="#0e5f72" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-64,-176 C-40,-184 -14,-186 0,-186 C18,-186 44,-183 66,-176" stroke="rgba(8,60,74,.3)" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <style>
      .limb{fill:url(#gBody);stroke:#15532f;stroke-width:5;stroke-linejoin:round}
      .twist{fill:none;stroke:#3fc9e0;stroke-width:9;stroke-linecap:round;opacity:.75}
      .side{fill:none;stroke:#3fc9e0;stroke-width:10;stroke-linecap:round;opacity:.8}
      .stitch{fill:none;stroke:#15532f;stroke-width:2.4;stroke-linecap:round;opacity:.45;stroke-dasharray:5 6}
    </style>
  </svg>

  <div class="meter" id="meter"><i id="meterFill"></i><u id="meterMark"></u></div>
</div>

<div class="modes" role="group" aria-label="Mod">
  <button id="mParrot" aria-pressed="true">🦜 Papağan</button>
  <button id="mSmart" aria-pressed="false">🧠 Akıllı</button>
</div>

<div class="fx" id="fxRow" role="group" aria-label="Ses efekti"></div>

<div class="talk" id="talk">
  <div class="bubble cactus">Sürekli dinle'ye bas, sonra konuş. Sustuğun anda seni efektli geri söylerim.</div>
</div>

<div class="row">
  <button class="mic" id="micBtn">🎧 Sürekli dinle</button>
  <button class="ghost-btn" id="danceBtn" title="Dans et">💃</button>
</div>

<div class="field">
  <input id="txt" type="text" placeholder="Ya da buraya yaz…" autocomplete="off">
  <button id="sendBtn">Gönder</button>
</div>

<div class="tune on" id="tune">
  <label><span>Mikrofon hassasiyeti</span><span id="thVal">orta</span></label>
  <input id="th" type="range" min="0.02" max="0.30" step="0.01" value="0.10">
</div>

<div class="settings" id="settings">
  <select id="brain" aria-label="Cevap kaynağı">
    <option value="auto">Beyin: otomatik</option>
    <option value="claude">Claude (kendi API anahtarım)</option>
    <option value="ollama">Ollama (yerel ağ)</option>
    <option value="offline">Kaktüs beyni (çevrimdışı)</option>
  </select>
  <input id="brainCfg" type="password" placeholder="sk-ant-… anahtarın (isteğe bağlı)" autocomplete="off">
</div>

<p class="diag" id="diag"></p>
<p class="note">Karakter orijinal bir tasarım, lisanslı bir kahraman değil.</p>
</div>

<script>
const el = id => document.getElementById(id);

/* ============ 1) RIG ============ */
const N = {
  root: el('rootBob'), s1: el('s1'), s2: el('s2'), s3: el('s3'), head: el('head'),
  armL: el('armL'), armLF: el('armLF'), armR: el('armR'), armRF: el('armRF'),
  pot: el('pot'), mouth: el('mouth'), eye: el('eyeScale'), pupils: el('pupils'), tip: el('hoodTip')
};
function ch(v, k = 120, d = 14) { return { x: v, v: 0, t: v, k, d }; }
const C = {
  s1: ch(0), s2: ch(0), s3: ch(0), head: ch(0),
  armL: ch(-76, 90, 12), armLF: ch(-20, 90, 12), armR: ch(76, 90, 12), armRF: ch(20, 90, 12),
  bobY: ch(0, 200, 16), rootRot: ch(0), sx: ch(1, 160, 15), sy: ch(1, 160, 15),
  potSy: ch(1, 220, 18), mouth: ch(.1, 260, 20), eye: ch(1, 200, 16),
  pupX: ch(0, 80, 12), pupY: ch(0, 80, 12), tip: ch(0, 70, 9)
};
let state = 'idle', level = 0, blinkAt = 2, eyeClose = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function setState(s, label) {
  state = s;
  el('dot').className = 'dot' + (s === 'listening' ? ' live' : (s === 'thinking' ? ' busy' : ''));
  el('status').textContent = label || ({ idle: 'Uyukluyor', listening: 'Dinliyor', thinking: 'Düşünüyor', talking: 'Konuşuyor', dance: 'Dans ediyor' })[s];
}

function targets(t) {
  const T = C, a = level;
  if (state === 'idle') {
    const s = Math.sin(t * 1.1);
    T.s1.t = s * 2.2; T.s2.t = Math.sin(t * 1.1 - .5) * 3; T.s3.t = Math.sin(t * 1.1 - 1) * 3.5;
    T.head.t = -s * 3;
    T.armL.t = -76 + Math.sin(t * .9) * 4; T.armLF.t = -20 + Math.sin(t * 1.3) * 5;
    T.armR.t = 76 - Math.sin(t * .9 + .5) * 4; T.armRF.t = 20 - Math.sin(t * 1.3 + .5) * 5;
    T.bobY.t = Math.sin(t * 1.1) * 2; T.rootRot.t = s * .8;
    T.sx.t = 1; T.sy.t = 1; T.potSy.t = 1; T.mouth.t = .1; T.eye.t = 1;
  } else if (state === 'listening') {
    const w = Math.sin(t * 9) * a;
    T.s1.t = w * 2; T.s2.t = w * 3; T.s3.t = w * 4 + 2;
    T.head.t = -w * 4;
    T.armL.t = -104 - a * 24; T.armLF.t = -46 - a * 20;
    T.armR.t = 104 + a * 24; T.armRF.t = 46 + a * 20;
    T.bobY.t = -a * 5; T.rootRot.t = w * 1.4;
    T.sx.t = 1 - a * .03; T.sy.t = 1 + a * .07; T.potSy.t = 1;
    T.mouth.t = .08 + a * .2; T.eye.t = 1.12 + a * .16; T.pupY.t = -3;
  } else if (state === 'thinking') {
    T.s1.t = -2; T.s2.t = -4; T.s3.t = -7 + Math.sin(t * 1.6) * 2;
    T.head.t = 13 + Math.sin(t * 1.6) * 2;
    T.armL.t = -68; T.armLF.t = -14;
    T.armR.t = 44 + Math.sin(t * 3.4) * 5; T.armRF.t = 94;
    T.bobY.t = 0; T.rootRot.t = -2; T.sx.t = 1; T.sy.t = 1; T.potSy.t = 1;
    T.mouth.t = .05; T.eye.t = .85; T.pupX.t = -5; T.pupY.t = -6;
  } else if (state === 'talking') {
    const g = .35 + a;
    T.s1.t = Math.sin(t * 3.4) * 3 * g; T.s2.t = Math.sin(t * 3.4 - .5) * 5 * g; T.s3.t = Math.sin(t * 3.4 - 1) * 7 * g;
    T.head.t = Math.sin(t * 7) * 5 * g;
    T.armL.t = -82 - a * 26 + Math.sin(t * 5) * 8; T.armLF.t = -24 - a * 24;
    T.armR.t = 82 + a * 26 - Math.sin(t * 5 + 1) * 8; T.armRF.t = 24 + a * 24;
    T.bobY.t = -Math.abs(Math.sin(t * 4)) * 5 * g; T.rootRot.t = Math.sin(t * 3.4) * 1.5;
    T.sx.t = 1 - a * .04; T.sy.t = 1 + a * .06;
    T.potSy.t = 1 - Math.max(0, Math.sin(t * 4)) * .03;
    T.mouth.t = .1 + a * .95; T.eye.t = 1 + a * .1; T.pupX.t = Math.sin(t * 1.7) * 4; T.pupY.t = 0;
  } else {
    const b = t * 5.2;
    T.s1.t = Math.sin(b) * 7; T.s2.t = Math.sin(b - .7) * 11; T.s3.t = Math.sin(b - 1.4) * 15;
    T.head.t = Math.sin(b - 2) * 12;
    T.armL.t = -98 + Math.sin(b) * 42; T.armLF.t = -38 + Math.sin(b * 2) * 34;
    T.armR.t = 98 + Math.sin(b + Math.PI) * 42; T.armRF.t = 38 + Math.sin(b * 2 + 1) * 34;
    T.bobY.t = -Math.abs(Math.sin(b)) * 12; T.rootRot.t = Math.sin(b * .5) * 5;

let ac = null, micStream = null, proc = null, playAnalyser = null, pbuf = null;
let micLevel = 0, fakeTalk = false, fakeSeed = 0;
const CAP = { chunks: [], pre: [], preLen: 0, recording: false, preMax: 0 };

function readLevel() {
  if (fakeTalk) return Math.min(1, .35 + Math.abs(Math.sin(perfNow() * 11 + fakeSeed)) * .4 + Math.abs(Math.sin(perfNow() * 27)) * .2);
  if (playAnalyser) {
    if (!pbuf || pbuf.length !== playAnalyser.fftSize) pbuf = new Float32Array(playAnalyser.fftSize);
    playAnalyser.getFloatTimeDomainData(pbuf);
    let s = 0; for (let i = 0; i < pbuf.length; i++) s += pbuf[i] * pbuf[i];
    return Math.min(1, Math.sqrt(s / pbuf.length) * 9);
  }
  return Math.min(1, micLevel * 9);
}
let _t = 0; const perfNow = () => _t;

function diag(m) { const d = el('diag'); d.textContent = m || ''; d.classList.toggle('on', !!m); }
function checkEnv() {
  const inFrame = window.self !== window.top;
  if (!window.isSecureContext) return 'Sayfa https değil, mikrofon kapalı. GitHub Pages linkinden aç.';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return inFrame ? 'Bu önizleme çerçevesi mikrofon iznini taşımıyor. Yayınladığın linkten aç.' : 'Bu tarayıcı mikrofon vermiyor.';
  return '';
}

async function ensureMic() {
  if (micStream) { if (ac.state === 'suspended') await ac.resume(); return true; }
  const e0 = checkEnv(); if (e0) { diag(e0); return false; }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') await ac.resume();
    CAP.preMax = Math.round(ac.sampleRate * .35);
    const src = ac.createMediaStreamSource(micStream);
    proc = ac.createScriptProcessor(2048, 1, 1);
    const mute = ac.createGain(); mute.gain.value = 0;
    src.connect(proc); proc.connect(mute); mute.connect(ac.destination);
    proc.onaudioprocess = ev => {
      const inp = ev.inputBuffer.getChannelData(0);
      let s = 0; for (let i = 0; i < inp.length; i++) s += inp[i] * inp[i];
      micLevel = Math.sqrt(s / inp.length);
      const copy = new Float32Array(inp);
      if (CAP.recording) { CAP.chunks.push(copy); }
      else {
        CAP.pre.push(copy); CAP.preLen += copy.length;
        while (CAP.preLen > CAP.preMax) CAP.preLen -= CAP.pre.shift().length;
      }
    };
    diag(''); return true;
  } catch (err) {
    const map = {
      NotAllowedError: 'Mikrofon izni verilmedi. Adres çubuğundaki kilit ikonundan aç.',
      NotFoundError: 'Mikrofon bulunamadı.', NotReadableError: 'Mikrofonu başka bir uygulama kullanıyor.'
    };
    diag((map[err.name] || 'Mikrofon açılamadı (' + err.name + ').') + ' Yazarak oynayabilirsin.');
    return false;
  }
}
function buildBuffer(chunks) {
  const len = chunks.reduce((a, c) => a + c.length, 0);
  const b = ac.createBuffer(1, Math.max(len, 128), ac.sampleRate);
  const d = b.getChannelData(0); let o = 0;
  for (const c of chunks) { d.set(c, o); o += c.length; }
  // sessiz kayıtları biraz kaldır
  let peak = 0; for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
  if (peak > .001 && peak < .5) { const g = Math.min(4, .5 / peak); for (let i = 0; i < d.length; i++) d[i] *= g; }
  return b;
}

const FX = ['sincap', 'dev', 'robot', 'yanki', 'uzayli', 'telefon', 'koro', 'ters', 'rastgele'];
const FXNAME = { sincap: '🐿️ Sincap', dev: '👹 Dev', robot: '🤖 Robot', yanki: '🕳️ Yankı', uzayli: '👽 Uzaylı', telefon: '📞 Telefon', koro: '👥 Koro', ters: '🔁 Ters', rastgele: '🎲 Rastgele' };
let fx = 'sincap';

function reversed(b) {
  const n = ac.createBuffer(1, b.length, b.sampleRate);
  const s = b.getChannelData(0), d = n.getChannelData(0);
  for (let i = 0; i < s.length; i++) d[i] = s[s.length - 1 - i];
  return n;
}
function shaper(amount) {
  const ws = ac.createWaveShaper(), n = 1024, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = (1 + amount) * x / (1 + amount * Math.abs(x)); }
  ws.curve = curve; return ws;
}

function playFx(buffer, kind) {
  const k = kind === 'rastgele' ? FX[Math.floor(Math.random() * (FX.length - 1))] : kind;
  const out = ac.createGain(); out.gain.value = .9;
  const an = ac.createAnalyser(); an.fftSize = 1024;
  out.connect(an); an.connect(ac.destination);
  playAnalyser = an;
  const srcs = [], extras = [];
  const mk = (buf, rate) => { const s = ac.createBufferSource(); s.buffer = buf; s.playbackRate.value = rate; srcs.push(s); return s; };

  if (k === 'sincap') {
    mk(buffer, 1.65).connect(out);
  } else if (k === 'dev') {
    const s = mk(buffer, .72);
    const lp = ac.createBiquadFilter(); lp.type = 'lowshelf'; lp.frequency.value = 320; lp.gain.value = 9;
    s.connect(lp); lp.connect(shaperTo(out, .4));
  } else if (k === 'robot') {
    const s = mk(buffer, 1);
    const ring = ac.createGain(); ring.gain.value = 0;
    const osc = ac.createOscillator(); osc.type = 'square'; osc.frequency.value = 52;
    osc.connect(ring.gain); osc.start(); extras.push(osc);
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 180;
    s.connect(ring); ring.connect(hp); hp.connect(out);
  } else if (k === 'yanki') {
    const s = mk(buffer, 1.15);
    const dly = ac.createDelay(1); dly.delayTime.value = .21;
    const fb = ac.createGain(); fb.gain.value = .42;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    s.connect(out); s.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly); dly.connect(out);
  } else if (k === 'uzayli') {
    const s = mk(buffer, 1.25);
    const dly = ac.createDelay(.05); dly.delayTime.value = .009;
    const lfo = ac.createOscillator(); lfo.frequency.value = 6.5;
    const depth = ac.createGain(); depth.gain.value = .005;
    lfo.connect(depth); depth.connect(dly.delayTime); lfo.start(); extras.push(lfo);
    s.connect(out); s.connect(dly); dly.connect(out);
  } else if (k === 'telefon') {
    const s = mk(buffer, 1.05);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 1.1;

      const s = mk(buffer, r);
      const g = ac.createGain(); g.gain.value = .55;
      const d = ac.createDelay(.1); d.delayTime.value = Math.abs(off) + .004;

    });

    mk(reversed(buffer), 1.1).connect(out);
  }

  function shaperTo(dest, amt) { const ws = shaper(amt); ws.connect(dest); return ws; }

  fakeTalk = false; setState('talking', 'Efekt: ' + FXNAME[k].replace(/^\S+\s/, ''));
  let done = 0;
  srcs.forEach(s => {
    s.onended = () => {
      if (++done < srcs.length) return;
      extras.forEach(o => { try { o.stop(); } catch (e) { } });
      playAnalyser = null; level = 0;
      setState('dance');
      setTimeout(() => { if (state === 'dance') setState(auto ? 'listening' : 'idle'); busy = false; }, 900);
    };
    s.start();
  });
  if (!srcs.length) { playAnalyser = null; busy = false; setState('idle'); }
}

let auto = false, busy = false;
const VAD = { on: false, sil: 0, dur: 0, hold: 0 };

function vadTick(dt) {
  if (!auto || !micStream) return;
  const th = parseFloat(el('th').value), L = micLevel;
  if (busy) { VAD.on = false; VAD.sil = 0; return; }
  if (!VAD.on) {
    if (L > th) {
      VAD.on = true; VAD.dur = 0; VAD.sil = 0;
      CAP.chunks = CAP.pre.slice(); CAP.recording = true;
    }
  } else {
    VAD.dur += dt;
    if (L < th * .55) VAD.sil += dt; else VAD.sil = 0;
    if (VAD.sil > .6 || VAD.dur > 8) {
      VAD.on = false; CAP.recording = false;
      const chunks = CAP.chunks; CAP.chunks = [];
      if (VAD.dur > .25) { busy = true; playFx(buildBuffer(chunks), fx); }
    }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; _t += dt;
  const raw = readLevel();
  level += (raw - level) * (raw > level ? .45 : .12);
  blinkAt -= dt; if (blinkAt < 0) { eyeClose = 1; blinkAt = 2.4 + Math.random() * 3.4; }

}
